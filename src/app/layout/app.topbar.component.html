<div class="layout-topbar">
    <button #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()" aria-label="Toggle Menu">
        <i class="pi pi-bars"></i>
    </button>

    <a class="layout-topbar-logo" routerLink="">
        <img src="assets/layout/images/logo.svg" alt="logo">
        <span>HashSolo</span>
    </a>

    <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button"
        (click)="layoutService.showProfileSidebar()">
        <i class="pi pi-ellipsis-v"></i>
    </button>

    <div class="topbar-lang-toggle" role="group" aria-label="Language">
        <button type="button" [class.active]="i18n.lang === 'de'" (click)="i18n.setLang('de')" title="Deutsch">
            <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect width="18" height="4" y="0" fill="#111827"/><rect width="18" height="4" y="4" fill="#dc2626"/><rect width="18" height="4" y="8" fill="#facc15"/></svg>
        </button>
        <button type="button" [class.active]="i18n.lang === 'en'" (click)="i18n.setLang('en')" title="English">
            <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><rect width="18" height="12" fill="#1e3a8a"/><path d="M0 0l18 12M18 0L0 12" stroke="#fff" stroke-width="2.2"/><path d="M0 0l18 12M18 0L0 12" stroke="#dc2626" stroke-width="1.1"/><path d="M9 0v12M0 6h18" stroke="#fff" stroke-width="3.4"/><path d="M9 0v12M0 6h18" stroke="#dc2626" stroke-width="2"/></svg>
        </button>
    </div>

    <!-- <div #topbarmenu class="layout-topbar-menu"

        <button class="p-link layout-topbar-button" [routerLink]="'/documentation'">
            <i class="pi pi-cog"></i>
            <span>Settings</span>
        </button> 
    </div> -->
</div>
